# Builds the agent and its installer on every push to main, and attaches them
# as a downloadable artifact on the run. No versioning, signing or publishing
# yet -- this is the "grab the latest build without installing a .NET SDK and
# NSIS locally" step, not a release pipeline.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you rebuild from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read

# A second push while one is still building makes the first result stale, so
# drop it rather than paying for both.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Must be Windows: the project is win-x64 self-contained and P/Invokes
    # into winspool.drv, and makensis has to run here too.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Not preinstalled on GitHub's Windows runners.
      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build agent and installer
        shell: pwsh
        run: |
          # Resolve makensis explicitly rather than trusting PATH: Chocolatey
          # updates the machine PATH, but this step's environment was captured
          # before that install ran, so the shim may not be visible yet.
          $makensis = 'C:/Program Files (x86)/NSIS/makensis.exe'
          if (-not (Test-Path $makensis)) {
            $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          }
          if (-not $makensis) { throw 'makensis.exe not found after installing NSIS' }
          # github.run_number increments per run, so every build off main
          # gets a distinct version at /health instead of all claiming 1.0.0.
          .\build.ps1 -MakeNsis $makensis -BuildNumber ${{ github.run_number }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          # GitHub serves artifacts as a .zip; this is the name inside the UI.
          name: shelivo-print-agent-${{ github.sha }}
          path: |
            dist/ShelivoPrintAgentSetup.exe
            dist/shelivo-print-agent.exe
          # Without this a broken build still "succeeds" with an empty artifact.
          if-no-files-found: error
          retention-days: 30
